# Free, single-service deployment: the web app runs the AI worker inside the same process
# (RUN_WORKER_IN_PROCESS), because Render has no free background workers.
# Trade-offs: the free service sleeps after 15 minutes without traffic (the first request wakes it, about a minute)
# and has 512 MB of memory. Unfinished runs resume automatically after a restart.
# Use render.yaml (paid, separate worker) for anything beyond a demo.
services:
  - type: web
    name: predestination-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -c requirements.lock
    # Pre-deploy commands are not available on the free plan, so migrate on start (it is idempotent).
    startCommand: python -m app.db.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      # Neon: pooled connection string for the app, direct (non-pooled) string for migrations and checkpoints.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      # Groq free key from https://console.groq.com/keys
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_WORKER_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_EVALUATOR_MODEL
        value: openai/gpt-oss-20b
