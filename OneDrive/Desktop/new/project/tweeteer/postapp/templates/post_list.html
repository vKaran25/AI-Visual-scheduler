{% extends "layout.html" %}
{% block title %}post list{% endblock %}
{% block content %}
    <a class="btn btn-primary mb-4 mt-2" href="{% url "post_create" %}" role="button">Create Post</a>
    <div class="class row gx-3">
        {% for post in posts %}
        <div class="card" style="width: 18rem;">
        <img src="{{post.photo.url}}" class="card-img-top" alt="...">
        <div class="card-body">
        <h5 class="card-title">{{post.user.username}}</h5>
        <p class="card-text">{{post.text}}</p>
        {% if post.user == user %}
        <a href="{% url "post_edit" post.id %}" class="btn btn-primary">Edit</a>
        <a href="{% url "post_delete" post.id %}" class="btn btn-danger">Delete</a>
        {% endif %}
        </div>
        </div>
        {% endfor %}
{% endblock %}
