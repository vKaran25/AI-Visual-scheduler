{% extends "layout.html" %}
{% block content %}
    <h3>login form</h3>
    <form method='post'>
        {% csrf_token %}
        {{form.as_p}}

        <input type="hidden" name="next" value="{{ next|default:'' }}">

        <a href="{% url "post_list" %}"><button class='btn btn-primary'>Login</button></a>
    </form>
    <p>New user? <a href="{% url "Register" %}">Signup</a></p>
{% endblock %}
