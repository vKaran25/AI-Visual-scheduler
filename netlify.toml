[build]
  publish = "frontend"

[[redirects]]
  from = "/api/*"
  to = "https://predestination.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/home"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
