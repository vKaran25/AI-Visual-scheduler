envVarGroups:
  - name: predestination
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_WORKER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: OPENROUTER_EVALUATOR_MODEL
        value: xingchen-agi/xing4.0-29b-a4b:free
      - key: COOKIE_SECURE
        value: "true"
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: APP_BASE_URL
        value: https://predestinationai.netlify.app
      - key: CORS_ORIGINS
        value: https://predestinationai.netlify.app
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://predestinationai.netlify.app/api/google/oauth/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
services:
  - type: web
    name: predestination
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt -c requirements.lock
    preDeployCommand: python -m app.db.migrate
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: predestination
      - key: PYTHON_VERSION
        value: "3.12.12"
  - type: worker
    name: predestination-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt -c requirements.lock
    startCommand: python -m app.runtime.worker
    envVars:
      - fromGroup: predestination
      - key: PYTHON_VERSION
        value: "3.12.12"
