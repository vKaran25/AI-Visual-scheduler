services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
      DATABASE_DIRECT_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
    command: python -m app.db.migrate
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
      DATABASE_DIRECT_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
      DATABASE_DIRECT_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
    command: python -m app.runtime.worker
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  postgres-data:
